webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      binary = "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
      args = ["--remote-allow-origins=*", "start-maximized", "ignore-certificate-errors", "--incognito"]
    }
    timeouts {
      implicit = 15000
      script = 30000
      pageLoad = 30000
    }
  }
  wait.for.timeout = 20000
}

headless.mode = false

serenity {
  take.screenshots = AFTER_EACH_STEP
}
